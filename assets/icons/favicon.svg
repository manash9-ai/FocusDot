<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D2FF3A"/>
      <stop offset="75%" stop-color="#A5DB12"/>
      <stop offset="100%" stop-color="#D2FF3A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D2FF3A" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#D2FF3A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#080A0F"/>
  <!-- Ambient glow -->
  <circle cx="50" cy="50" r="42" fill="url(#ambientAura)"/>
  <!-- Orbital ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#D2FF3A" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="4 2"/>
  <!-- Neon Core Sphere -->
  <circle cx="50" cy="50" r="16" fill="url(#neonGlow)"/>
</svg>

